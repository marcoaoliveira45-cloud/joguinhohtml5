<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f1e8">
  <meta name="description" content="Corra pelo mundo do HTML5 e desvie das tags!">
  <title>HTML Run — Corrida de Tags</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <a class="brand" href="./" aria-label="HTML Run, início">
        <span class="brand-icon" aria-hidden="true">&lt;/&gt;</span>
        <span>HTML <strong>RUN</strong></span>
      </a>
      <span class="pixel-label">EDIÇÃO HTML5</span>
    </header>

    <section class="game-panel" aria-labelledby="game-title">
      <div class="game-heading">
        <div>
          <p class="eyebrow">CORRIDA DE TAGS</p>
          <h1 id="game-title">Corra. Pule. <span>Codifique.</span></h1>
        </div>
        <p class="score-hint">RECORDE <strong id="best-score">00000</strong></p>
      </div>

      <div class="canvas-frame">
        <canvas id="game-canvas" width="800" height="260" tabindex="0"
          role="img" aria-label="Jogo HTML Run. Desvie das tags pulando.">
          Seu navegador não suporta canvas. Atualize o navegador para jogar.
        </canvas>
      </div>
      <p class="sr-only" id="game-status" role="status" aria-live="polite">Aperte espaço ou toque para começar.</p>

      <div class="game-controls">
        <p><kbd>ESPAÇO</kbd> / <kbd>↑</kbd> ou toque para pular</p>
        <button class="start-button" id="start-button" type="button">Começar jogo <span aria-hidden="true">→</span></button>
      </div>
    </section>

    <footer class="game-footer">
      <span>FEITO DE PIXELS E TAGS</span>
      <span aria-hidden="true">&lt;html&gt; ♥</span>
    </footer>
  </main>
</body>
</html>
